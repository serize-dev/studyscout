[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "studyscout"
version = "1.7.0"
description = "STUDY//SCOUT — phosphor-green clinical-trials BD intel terminal."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Arturo Serize" }]
license = { text = "MIT" }
dependencies = [
    "textual>=0.86,<1.0",
    "httpx>=0.27",
    "anthropic>=0.40",
    "tomli-w>=1.0",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]

[project.scripts]
studyscout = "studyscout.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
studyscout = ["tui/*.tcss"]
